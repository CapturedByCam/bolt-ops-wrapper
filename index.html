<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bolt Ops">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <title>Bolt Ops</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --yellow: #ffd51a;
      --text: #ffffff;
      --muted: #d4d4d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
      font-family: Arial, sans-serif;
    }

    iframe {
      position: fixed;
      inset: 0;
      border: 0;
      background: #f5f6f8;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 34%, rgba(255, 213, 26, 0.12), transparent 24%),
        linear-gradient(180deg, #111111 0%, var(--black) 100%);
      color: var(--text);
      text-align: center;
    }

    .fallback-card {
      display: grid;
      justify-items: center;
      gap: 14px;
      max-width: 360px;
    }

    .fallback img {
      width: 118px;
      height: 118px;
      filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.35));
    }

    .fallback-title {
      font-size: 28px;
      font-weight: 900;
    }

    .fallback-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .fallback-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--yellow);
      border-radius: 8px;
      background: var(--yellow);
      color: #050505;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <iframe
    title="Bolt Ops Dashboard"
    src="https://script.google.com/macros/s/AKfycbyJ3AEUpfq9Nx_KKLPe2fawd9zu83XcbGWCowr-u4aztl20L2CnKzFeY1QmjuHB-9_3DA/exec"
    allow="geolocation"
  ></iframe>
  <noscript>
    <div class="fallback">
      <div class="fallback-card">
        <img src="/apple-touch-icon.png" alt="Bolt Ops icon">
        <div class="fallback-title">Bolt Ops</div>
        <div class="fallback-copy">JavaScript is required to load the dashboard.</div>
        <a class="fallback-link" href="https://script.google.com/macros/s/AKfycbyJ3AEUpfq9Nx_KKLPe2fawd9zu83XcbGWCowr-u4aztl20L2CnKzFeY1QmjuHB-9_3DA/exec">Open Dashboard</a>
      </div>
    </div>
  </noscript>
</body>
</html>
